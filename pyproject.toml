[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bakuml"
version = "0.1.0"
description = "Beyond Price Prediction: a spatiotemporal ML study of Baku & Absheron real estate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Holberton School ML Graduation Project - Group 3" },
]

[tool.setuptools.packages.find]
include = ["bakuml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
